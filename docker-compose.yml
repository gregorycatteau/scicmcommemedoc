services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-mcomme_medoc}
      POSTGRES_USER: ${DB_USER:-change-me}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      GRAPHQL_ENDPOINT: ${GRAPHQL_ENDPOINT:-http://localhost:8000/graphql}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
